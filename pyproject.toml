[project]
name = "stock-dashboard"
version = "0.1.0"
description = "뉴스·수급·실시간 체결을 모아보는 로컬 주식 대시보드"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.45,<2", "plotly>=6,<7", "pandas>=2.2,<3",
  "httpx>=0.28,<1", "websockets>=15,<17", "python-dotenv>=1,<2",
  "exchange-calendars>=4.11,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
